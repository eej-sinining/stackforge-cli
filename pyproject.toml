[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stackforge-cli"
version = "0.1.5"
description = "A CLI scaffolder for .NET Clean Architecture projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["scaffolder", "dotnet", "clean-architecture", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stackforge = "stackforge.scaffold:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stackforge = ["templates/**/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["dotnet: builds the generated solution with the .NET SDK (slow)"]