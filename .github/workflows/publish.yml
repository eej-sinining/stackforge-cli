name: Publish to PyPI

# Publishes when a push to main carries a version (pyproject.toml) that is not on PyPI yet.
# Pushes without a version bump build nothing and publish nothing.
# Auth: PyPI Trusted Publishing (OIDC) — no API token is stored in GitHub.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: check
        name: Compare pyproject version with PyPI
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${NAME}/${VERSION}/json")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${NAME} ${VERSION} is already on PyPI; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${NAME} ${VERSION} is new; publishing."
          fi

  tests:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [check-version, tests]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stackforge-cli/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
